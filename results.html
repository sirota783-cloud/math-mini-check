<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>התוצאות שלי</title>

<style>
body{
  font-family:Arial,sans-serif;
  max-width:820px;
  margin:30px auto;
  padding:0 16px;
  background:#fafafa;
  text-align:right
}
.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  padding:18px;
  margin:14px 0
}
input,button{
  font-size:16px;
  padding:10px;
  width:100%;
  box-sizing:border-box;
  margin:6px 0
}
button{cursor:pointer}
.result{
  border-top:1px solid #eee;
  padding:14px 0
}
.status{color:#666}
.error{color:#a00}
</style>
</head>

<body>

<h1>התוצאות שלי</h1>

<p>
<a href="index.html">← חזרה להגשה</a>
</p>

<div class="card">

<input id="student_code" placeholder="קוד סטודנט">

<input id="pin" type="password" placeholder="קוד PIN">

<button id="load">הצגת תוצאות</button>

<div id="out"></div>

</div>

<script>

const SUPABASE_URL =
"https://bthkzkdsijnhuvnewzuj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_gsoH21Rei_f5rQyrjXyXPQ_8oI8LKR0";

const COURSE_LABELS = {
  MATH: "מתמטיקה — קורס הכנה",
  DISCRETE: "מתמטיקה בדידה",
  general: "כללי"
};

function splitQuizId(value) {
  const raw = String(value ?? "").trim();

  if (raw.startsWith("v2::")) {
    const parts = raw.split("::");
    if (parts.length >= 4) {
      const rawCourse = parts[1] || "general";
      const lowerCourse = rawCourse.toLowerCase();
      const courseId =
        ["math", "mathematics", "prep", "preparatory"].includes(lowerCourse)
          ? "MATH"
          : ["discrete", "discrete-math", "discrete_math", "בדידה"].includes(lowerCourse)
            ? "DISCRETE"
            : rawCourse;

      return {
        course_id: courseId,
        quiz_id: parts.slice(3).join("::") || "1"
      };
    }
  }

  return {course_id: "general", quiz_id: raw};
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


document.getElementById("load").onclick = async () => {

  const out = document.getElementById("out");

  const studentCode =
    document.getElementById("student_code").value.trim();

  const pin =
    document.getElementById("pin").value.trim();

  if (!studentCode || !pin) {
    out.innerHTML =
      '<p class="error">יש להזין קוד סטודנט ו-PIN.</p>';
    return;
  }

  out.innerHTML =
    '<p class="status">טוען...</p>';

  try {

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/rpc/get_mini_check_results",
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          p_student_code: studentCode,
          p_pin: pin
        })
      }
    );

    if (!response.ok) {
      console.error(await response.text());
      out.innerHTML =
        '<p class="error">שגיאה בקבלת התוצאות.</p>';
      return;
    }

    const results = await response.json();

    if (results.length === 0) {
      out.innerHTML =
        '<p>לא נמצאו תוצאות עבור הקוד שהוזן.</p>';
      return;
    }

    out.innerHTML = results.map(x => {

      const quiz = splitQuizId(x.quiz_id);
      const courseName =
        COURSE_LABELS[quiz.course_id] || quiz.course_id;

      const score =
        x.score === null
        ? "בבדיקה"
        : x.score;

      const feedback =
        x.feedback
        ? `<div>${escapeHtml(x.feedback)}</div>`
        : "";

      return `
        <div class="result">
          <strong>${escapeHtml(courseName)} — תרגול ${escapeHtml(quiz.quiz_id)}</strong>
          <div>ציון: ${escapeHtml(score)}</div>
          <div>סטטוס: ${escapeHtml(x.status)}</div>
          ${feedback}
        </div>
      `;

    }).join("");

  }

  catch(error) {

    console.error(error);

    out.innerHTML =
      '<p class="error">שגיאת תקשורת.</p>';

  }

};

</script>

</body>
</html>
