<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>התוצאות שלי</title>
<style>
body{font-family:Arial,sans-serif;max-width:820px;margin:30px auto;padding:0 16px;background:#fafafa;text-align:right}
.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin:14px 0}
input,button{font-size:16px;padding:10px;width:100%;box-sizing:border-box;margin:6px 0}
.result{border-top:1px solid #eee;padding:12px 0}
button{cursor:pointer}
</style>
</head>
<body>
<h1>התוצאות שלי</h1>
<p><a href="index.html">← חזרה להגשה</a></p>

<div class="card">
<input id="student_code" placeholder="קוד סטודנט">
<input id="pin" type="password" placeholder="קוד PIN">
<button id="load">הצגת תוצאות</button>
<div id="out"></div>
</div>

<script>
const API="REPLACE_WITH_BACKEND_URL";
document.getElementById("load").onclick=async()=>{
  const out=document.getElementById("out");
  out.textContent="טוען…";
  try{
    const r=await fetch(API+"/results",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        student_code:document.getElementById("student_code").value.trim(),
        pin:document.getElementById("pin").value
      })
    });
    const d=await r.json();
    if(!r.ok){out.textContent=d.error||"אירעה שגיאה";return}
    out.innerHTML=d.results.map(x=>`
      <div class="result">
        <b>בוחן ${x.quiz_id}</b> — ${x.score??"בבדיקה"}
        <div>${x.feedback??""}</div>
      </div>`).join("");
  }catch(e){out.textContent="השרת עדיין לא מחובר."}
};
</script>
</body>
</html>
