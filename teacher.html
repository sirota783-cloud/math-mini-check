<body>

<script>

const SUPABASE_URL =
  "https://bthkzkdsijnhuvnewzuj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_gsoH21Rei_f5rQyrjXyXPQ_8oI8LKR0";

const FILE_URL_ENDPOINT =
  "https://math-mini-check.onrender.com/teacher/file-url";


const COURSE_LABELS = {
  MATH: "מתמטיקה — קורס הכנה",
  DISCRETE: "מתמטיקה בדידה",
  general: "כללי",
  legacy: "הגשות ישנות"
  ,ALL: "כל המקצועות"
};


const quizFilter = document.getElementById("quiz_filter");

for (let number = 1; number <= 15; number += 1) {
  const option = document.createElement("option");
  option.value = String(number);
  option.textContent = "תרגול " + number;
  quizFilter.appendChild(option);
}


function normalizeCourseId(value) {
  const raw = String(value ?? "").trim();
  const lower = raw.toLowerCase();

  if (["math", "mathematics", "prep", "preparatory"].includes(lower)) {
    return "MATH";
  }

  if (["discrete", "discrete-math", "discrete_math", "בדידה"].includes(lower)) {
    return "DISCRETE";
  }

  return raw || "general";
}


function splitQuizId(value) {
  const raw = String(value ?? "").trim();

  if (raw.startsWith("v2::")) {
    const parts = raw.split("::");

    if (parts.length >= 4) {
      return {
        course_id: normalizeCourseId(parts[1]),
        group_id: parts[2] || "general",
        quiz_id: normalizeQuizId(parts.slice(3).join("::"))
      };
    }
  }

  return {
    course_id: "legacy",
    group_id: "general",
    quiz_id: normalizeQuizId(raw)
  };
}


function courseLabel(courseId) {
  return COURSE_LABELS[courseId] || courseId;
}


function normalizeQuizId(value) {

  const q =
    String(value ?? "").trim();

  if (
    q === "1" ||
    /^\.+$/.test(q)
  ) {
    return "1";
  }

  return q;
}


function buildSubmissionGroups(rows) {

  const groups =
    new Map();

  for (const row of rows) {

    const studentCode =
      String(row.student_code ?? "").trim();

    const quizParts = splitQuizId(row.quiz_id);

    const quizId = quizParts.quiz_id;

    const courseId = quizParts.course_id;

    const groupId = quizParts.group_id;

    const key =
      courseId + "||" + groupId + "||" +
      quizId + "||" + studentCode;

    if (!groups.has(key)) {

      groups.set(key, {
        student_code: studentCode,
        course_id: courseId,
        group_id: groupId,
        quiz_id: quizId,
        quiz_key: String(row.quiz_id ?? "").trim(),
        rows: []
      });

    }

    groups.get(key).rows.push(row);
  }

  return Array.from(groups.values());
}


function groupScoreText(group) {

  const scores =
    group.rows
      .map(row => row.score)
      .filter(score => score !== null && score !== undefined);

  if (scores.length === 0) {
    return "טרם נבדק";
  }

  const uniqueScores =
    [...new Set(scores.map(Number))];

  if (
    scores.length === group.rows.length &&
    uniqueScores.length === 1
  ) {
    return String(uniqueScores[0]);
  }

  if (uniqueScores.length === 1) {
    return String(uniqueScores[0]) + " (חלק מההגשות)";
  }

  return "יש ציונים שונים בין חלקי ההגשה";
}


function groupFeedbackText(group) {

  const feedbacks =
    group.rows
      .map(row => String(row.feedback ?? "").trim())
      .filter(Boolean);

  if (feedbacks.length === 0) {
    return "";
  }

  const unique =
    [...new Set(feedbacks)];

  if (unique.length === 1) {
    return unique[0];
  }

  return "קיימות הערות שונות בין חלקי ההגשה";
}


async function getSignedUrlsForGroup(
  group,
  password
) {

  const allUrls = [];

  for (const sourceRow of group.rows) {

    const r = await fetch(
      FILE_URL_ENDPOINT,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          teacher_password: password,
          file_path: sourceRow.file_path
        })
      }
    );

    let data = {};

    try {
      data = await r.json();
    } catch (_) {}

    if (
      !r.ok ||
      !Array.isArray(data.signedUrls) ||
      data.signedUrls.length === 0
    ) {

      throw new Error(
        data.error ||
        "Could not open files"
      );
    }

    allUrls.push(
      ...data.signedUrls
    );
  }

  return [
    ...new Set(allUrls)
  ];
}


document.getElementById("load").onclick = async () => {

  const password =
    document.getElementById(
      "teacher_password"
    ).value.trim();

  const status =
    document.getElementById(
      "status"
    );

  const works =
    document.getElementById(
      "works"
    );

  works.innerHTML = "";
  status.textContent = "";
  status.className = "";

  if (!password) {

    status.className =
      "error";

    status.textContent =
      "יש להזין סיסמת מרצה.";

    return;
  }

  try {

    status.textContent =
      "טוען עבודות...";

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/get_teacher_submissions",
        {
          method: "POST",

          headers: {
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + SUPABASE_KEY,

            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              p_teacher_password:
                password
            })
        }
      );

    if (!response.ok) {

      const t =
        await response.text();

      console.error(t);

      status.className =
        "error";

      status.textContent =
        "שגיאה בכניסה או בקבלת העבודות.";

      return;
    }

    const rows =
      await response.json();

    if (rows.length === 0) {

      status.textContent =
        "לא נמצאו עבודות.";

      return;
    }

    const groups =
      buildSubmissionGroups(rows);

    const selectedCourse =
      document.getElementById("course_filter").value;

    const selectedQuiz =
      document.getElementById("quiz_filter").value;

    const visibleGroups = groups.filter(group =>
      (selectedCourse === "ALL" || group.course_id === selectedCourse) &&
      (selectedQuiz === "ALL" || group.quiz_id === selectedQuiz)
    );

    status.className =
      "success";

    status.textContent =
      "נמצאו " +
      visibleGroups.length +
      " עבודות מאוחדות מתוך " +
      rows.length +
      " הגשות. מקצוע: " +
      courseLabel(selectedCourse) +
      (selectedQuiz === "ALL" ? "" : " | תרגול " + selectedQuiz) +
      ".";


    visibleGroups.forEach(group => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "card";

      const sourceQuizIds =
        [
          ...new Set(
            group.rows.map(
              row =>
                String(
                  row.quiz_id ?? ""
                ).trim()
            )
          )
        ];

      const historicalNote =
        (
          group.course_id === "legacy" &&
          group.quiz_id === "1" &&
          sourceQuizIds.some(
            q => q !== "1"
          )
        )
        ? `
          <p class="muted">
            הגשות ישנות שאוחדו לבוחן 1:
            ${escapeHtml(sourceQuizIds.join(", "))}
          </p>
        `
        : "";

      div.innerHTML = `

        <h3>
          ${escapeHtml(courseLabel(group.course_id))} —
          תרגול ${escapeHtml(group.quiz_id || "")}
        </h3>

        <p>
          <strong>קבוצה:</strong>
          ${escapeHtml(group.group_id || "")}
        </p>

        <p>
          <strong>קוד סטודנט:</strong>
          ${escapeHtml(group.student_code || "")}
        </p>

        <p>
          <strong>מספר הגשות שאוחדו:</strong>
          ${group.rows.length}
        </p>

        ${historicalNote}

        <p>
          <strong>ציון:</strong>
          ${escapeHtml(groupScoreText(group))}
        </p>

        <p>
          <strong>הערה:</strong>
          ${escapeHtml(groupFeedbackText(group))}
        </p>

      `;


      const openButton =
        document.createElement(
          "button"
        );

      openButton.textContent =
        "פתיחת העבודה המאוחדת";


      openButton.onclick =
        async () => {

          try {

            openButton.disabled =
              true;

            openButton.textContent =
              "פותח...";

            const urls =
              await getSignedUrlsForGroup(
                group,
                password
              );

            showSubmission(
              urls,
              group
            );

          }

          catch (e) {

            console.error(e);

            alert(
              "שגיאה בפתיחת העבודה"
            );

          }

          finally {

            openButton.disabled =
              false;

            openButton.textContent =
              "פתיחת העבודה המאוחדת";

          }

        };


      div.appendChild(
        openButton
      );

      works.appendChild(
        div
      );

    });

  }

  catch (e) {

    console.error(e);

    status.className =
      "error";

    status.textContent =
      "שגיאת תקשורת.";

  }

};



function showSubmission(
  urls,
  group
) {

  const oldViewer =
    document.getElementById(
      "submissionViewer"
    );

  if (oldViewer) {
    oldViewer.remove();
  }


  const viewer =
    document.createElement(
      "div"
    );

  viewer.id =
    "submissionViewer";

  viewer.className =
    "card";


  const pagesHtml =
    urls.map(
      (url, index) => `

        <div class="submission-page">

          <div class="page-label">
            עמוד ${index + 1}
          </div>

          <div
            class="image-wrap"
            id="pageImageWrap${index + 1}">
            <img
              src="${escapeHtml(url)}"
              alt="עמוד ${index + 1}"
            >
          </div>

        </div>

      `
    ).join("");


  viewer.innerHTML = `

    <h2>
      בדיקת עבודה מאוחדת
    </h2>

    <p>
      <strong>קוד סטודנט:</strong>
      ${escapeHtml(group.student_code || "")}
    </p>

    <p>
      <strong>מקצוע:</strong>
      ${escapeHtml(courseLabel(group.course_id))}
    </p>

    <p>
      <strong>תרגול:</strong>
      ${escapeHtml(group.quiz_id || "")}
    </p>

    <p>
      <strong>מספר הגשות שאוחדו:</strong>
      ${group.rows.length}
    </p>

    <p>
      <strong>מספר תמונות:</strong>
      ${urls.length}
    </p>

    <div>
      ${pagesHtml}
    </div>


    <div style="margin-top:18px;">

      <label>
        <strong>ציון:</strong>
      </label>

      <input
        id="submissionScore"
        type="number"
        min="0"
        max="100"
        placeholder="0-100"
      >


      <label>
        <strong>הערה:</strong>
      </label>

      <div
        id="submissionFeedback"
        contenteditable="true"
        dir="rtl"
        style="
          min-height:80px;
          border:1px solid #aaa;
          padding:8px;
          white-space:pre-wrap;
        ">
      </div>


      <button
        type="button"
        id="saveSubmissionReview">
        שמירת בדיקה
      </button>


      <button
        type="button"
        id="aiCheckSubmission">
        בדיקה עם AI
      </button>

      <p id="aiCheckStatus"></p>

    </div>


    <button
      type="button"
      id="closeSubmission">
      סגירה
    </button>

  `;


  document.body.appendChild(
    viewer
  );


  document.getElementById(
    "aiCheckSubmission"
  ).onclick = async () => {

    const status =
      document.getElementById(
        "aiCheckStatus"
      );

    status.textContent =
      "AI בודק את כל התמונות יחד...";

    try {

      const r =
        await fetch(
          SUPABASE_URL +
          "/functions/v1/ai-check-submission",
          {
            method: "POST",

            headers: {
              "apikey":
                SUPABASE_KEY,

              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                image_urls:
                  urls,

                quiz_id:
                  group.quiz_key
              })
          }
        );

      const data =
        await r.json();

      if (!r.ok) {

        throw new Error(
          data.error ||
          "AI check failed"
        );
      }


      document.getElementById(
        "submissionScore"
      ).value =
        data.score ?? "";


      const feedbackBox =
        document.getElementById(
          "submissionFeedback"
        );

      const feedbackText =
        data.feedback ?? "";

      renderErrorMarkers(
        Array.isArray(data.errors) ? data.errors : []
      );


      feedbackBox.innerHTML =
        feedbackText

        .split(
          /(\[\[.*?\]\])/g
        )

        .map(part => {

          if (
            part.startsWith("[[") &&
            part.endsWith("]]")
          ) {

            const formula =
              part
                .slice(2, -2)
                .trim()
                .replace(
                  /^\$+|\$+$/g,
                  ""
                );

            return `
              <span
                dir="ltr"
                style="display:inline-block;">
                \\(${escapeHtml(formula)}\\)
              </span>
            `;
          }

          return escapeHtml(
            part
          );
        })

        .join("");


      if (
        window.MathJax
          ?.typesetPromise
      ) {

        await MathJax.typesetPromise(
          [feedbackBox]
        );
      }


      status.textContent =
        data.exam_loaded
          ? "בדיקת AI הסתיימה. שאלות הבחינה המלאות שימשו לבדיקה: " +
            String(data.exam_code || "")
          : "בדיקת AI הסתיימה, אך קובץ שאלות הבחינה לא נמצא.";

      status.className =
        data.exam_loaded ? "success" : "error";

    }

    catch (e) {

      console.error(e);

      status.textContent =
        "שגיאה בבדיקת AI";

    }

  };



  document.getElementById(
    "saveSubmissionReview"
  ).onclick = async () => {

    const score =
      document.getElementById(
        "submissionScore"
      ).value.trim();

    const feedback =
      document.getElementById(
        "submissionFeedback"
      ).innerText.trim();


    if (
      score === "" ||
      Number(score) < 0 ||
      Number(score) > 100
    ) {

      alert(
        "יש להזין ציון בין 0 ל-100"
      );

      return;
    }


    const teacherPassword =
      document.getElementById(
        "teacher_password"
      ).value.trim();


    try {

      for (const sourceRow of group.rows) {

        const r =
          await fetch(
            SUPABASE_URL +
            "/functions/v1/teacher-submissions",
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  action:
                    "save",

                  teacher_password:
                    teacherPassword,

                  submission_id:
                    sourceRow.id,

                  score:
                    Number(score),

                  feedback:
                    feedback
                })
            }
          );

        if (!r.ok) {

          throw new Error(
            await r.text()
          );
        }
      }


      alert(
        "הבדיקה נשמרה לכל חלקי העבודה המאוחדת"
      );

      viewer.remove();

      await document.getElementById("load").onclick();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }

    catch (e) {

      console.error(e);

      alert(
        "שגיאה בשמירת הבדיקה"
      );

    }

  };


  document.getElementById(
    "closeSubmission"
  ).onclick = () => {

    viewer.remove();

  };


  viewer.scrollIntoView({
    behavior: "smooth"
  });

}


function renderErrorMarkers(errors) {

  document.querySelectorAll(
    ".error-marker"
  ).forEach(marker => marker.remove());

  for (const error of errors) {

    const page = Math.trunc(Number(error.page));
    const wrap = document.getElementById(
      "pageImageWrap" + page
    );

    if (!wrap) continue;

    const values = [
      Number(error.x),
      Number(error.y),
      Number(error.width),
      Number(error.height)
    ];

    if (!values.every(Number.isFinite)) continue;

    const [x, y, width, height] = values;
    if (width <= 0 || height <= 0) continue;

    const marker = document.createElement("div");
    marker.className = "error-marker";
    marker.style.left = Math.max(0, Math.min(100, x)) + "%";
    marker.style.top = Math.max(0, Math.min(100, y)) + "%";
    marker.style.width = Math.max(0, Math.min(width, 100 - x)) + "%";
    marker.style.height = Math.max(0, Math.min(height, 100 - y)) + "%";

    const label = document.createElement("span");
    label.textContent = String(error.label || "טעות");
    marker.appendChild(label);
    wrap.appendChild(marker);
  }
}



function escapeHtml(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



document.getElementById(
  "upload_exam"
).onclick = async () => {

  const password =
    document.getElementById(
      "teacher_password"
    ).value.trim();

  const examCode =
    document.getElementById(
      "exam_code"
    ).value.trim();

  const file =
    document.getElementById(
      "exam_file"
    ).files[0];

  const status =
    document.getElementById(
      "exam_upload_status"
    );


  if (!password) {

    alert(
      "יש להזין סיסמת מרצה"
    );

    return;
  }


  if (!examCode) {

    alert(
      "יש להזין קוד בחינה"
    );

    return;
  }


  if (!file) {

    alert(
      "יש לבחור קובץ שאלות"
    );

    return;
  }


  status.textContent =
    "מעלה שאלות...";


  const form =
    new FormData();

  form.append(
    "teacher_password",
    password
  );

  form.append(
    "exam_code",
    examCode
  );

  form.append(
    "file",
    file
  );


  try {

    const r =
      await fetch(
        "https://math-mini-check.onrender.com/teacher/exam-upload",
        {
          method: "POST",
          body: form
        }
      );

    const data =
      await r.json();

    if (!r.ok) {

      throw new Error(
        data.error ||
        "Upload failed"
      );
    }

    status.className =
      "success";

    status.textContent =
      "שאלות הבחינה הועלו בהצלחה";

  }

  catch (e) {

    console.error(e);

    status.className =
      "error";

    status.textContent =
      "שגיאה בהעלאת שאלות";

  }

};

</script>

</body>
</html>
