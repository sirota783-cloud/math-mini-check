<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מרצה — בדיקת תרגול קצר</title>

<style>
body{
  font-family:Arial,sans-serif;
  max-width:1000px;
  margin:30px auto;
  padding:16px;
  background:#fafafa;
  text-align:right;
}

.card{
  background:white;
  border:1px solid #ddd;
  border-radius:14px;
  padding:18px;
  margin:14px 0;
}

input,textarea,button{
  font-size:16px;
  padding:10px;
  width:100%;
  box-sizing:border-box;
  margin:6px 0;
}

button{cursor:pointer}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  border-bottom:1px solid #ddd;
  padding:9px;
  text-align:right;
}

.error{
  color:#a00;
  font-weight:bold;
}

.success{
  color:#087a20;
  font-weight:bold;
}

.muted{
  color:#666;
}

.work{
  border:1px solid #ddd;
  border-radius:10px;
  padding:14px;
  margin-top:12px;
}
</style>
</head>

<body>

<h1>מרצה</h1>

<p>
<a href="index.html">← חזרה לדף ההגשה</a>
</p>

<div class="card">

<h2>כניסת מרצה</h2>

<input
  id="teacher_password"
  type="password"
  placeholder="סיסמת מרצה"
>

<button id="load">הצגת עבודות</button>

<p id="status"></p>

</div>

<div id="works"></div>

<script>

const SUPABASE_URL =
  "https://bthkzkdsijnhuvnewzuj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_gsoH21Rei_f5rQyrjXyXPQ_8oI8LKR0";


document.getElementById("load").onclick = async () => {

  const password =
    document.getElementById("teacher_password").value.trim();

  const status =
    document.getElementById("status");

  const works =
    document.getElementById("works");

  works.innerHTML = "";
  status.textContent = "";
  status.className = "";

  if(!password){
    status.className = "error";
    status.textContent = "יש להזין סיסמת מרצה.";
    return;
  }

  try{

    status.textContent = "טוען עבודות...";

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/rpc/get_teacher_submissions",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          p_teacher_password:password
        })
      }
    );

    if(!response.ok){
      const t = await response.text();
      console.error(t);

      status.className = "error";
      status.textContent =
        "שגיאה בכניסה או בקבלת העבודות.";
      return;
    }

    const rows = await response.json();

    if(rows.length === 0){
      status.textContent = "לא נמצאו עבודות.";
      return;
    }

    status.className = "success";
    status.textContent =
      "נמצאו " + rows.length + " עבודות.";

    rows.forEach(row => {

      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <h3>בוחן ${escapeHtml(row.quiz_id || "")}</h3>

        <p>
        <strong>קוד סטודנט:</strong>
        ${escapeHtml(row.student_code || "")}
        </p>

        <p>
        <strong>סטטוס:</strong>
        ${escapeHtml(row.status || "")}
        </p>

        <p>
        <strong>קובץ:</strong>
        ${escapeHtml(row.file_path || "")}
        </p>

        <p>
        <strong>ציון:</strong>
        ${row.score == null ? "טרם נבדק" : escapeHtml(String(row.score))}
        </p>

        <p>
        <strong>הערה:</strong>
        ${escapeHtml(row.feedback || "")}
        </p>
      `;
const openButton = document.createElement("button");
openButton.textContent = "פתיחת העבודה";

openButton.onclick = async () => {
  try {
    openButton.disabled = true;
    openButton.textContent = "פותח...";

    const r = await fetch(
      SUPABASE_URL + "/functions/v1/teacher-submissions",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          teacher_password: password,
          file_path: row.file_path
        })
      }
    );

    const data = await r.json();

    if (!r.ok || !data.signedUrl) {
      throw new Error(data.error || "Could not open file");
    }

   showSubmission(data.signedUrl, row);
  } catch (e) {
    console.error(e);
    alert("שגיאה בפתיחת העבודה");
  } finally {
    openButton.disabled = false;
    openButton.textContent = "פתיחת העבודה";
  }
};

div.appendChild(openButton);
      works.appendChild(div);
    });

  }
  catch(e){

    console.error(e);

    status.className = "error";
    status.textContent = "שגיאת תקשורת.";

  }

};

function showSubmission(url, row) {
  const oldViewer = document.getElementById("submissionViewer");
  if (oldViewer) oldViewer.remove();

  const viewer = document.createElement("div");
  viewer.id = "submissionViewer";
  viewer.className = "card";

  viewer.innerHTML = `
    <h2>בדיקת עבודה</h2>
    <p><strong>קוד סטודנט:</strong> ${escapeHtml(row.student_code || "")}</p>

    <div style="text-align:center;">
      <img src="${url}"
           style="max-width:100%; height:auto; border:1px solid #ccc;">
    </div>

    <div style="margin-top:18px;">
      <label><strong>ציון:</strong></label>
      <input
        id="submissionScore"
        type="number"
        min="0"
        max="100"
        placeholder="0-100"
      >

      <label><strong>הערה:</strong></label>
      <textarea
        id="submissionFeedback"
        rows="4"
        placeholder="כתוב הערה לסטודנט"
      ></textarea>

    <button type="button" id="saveSubmissionReview">
  שמירת בדיקה
</button>

<button type="button" id="aiCheckSubmission">
  בדיקה עם AI
</button>

<p id="aiCheckStatus"></p>
</div>

    <button type="button" id="closeSubmission">סגירה</button>
  `;

  document.body.appendChild(viewer);
document.getElementById("saveSubmissionReview").onclick = async () => {
  const score = document.getElementById("submissionScore").value.trim();
  const feedback = document.getElementById("submissionFeedback").value.trim();

  if (score === "" || Number(score) < 0 || Number(score) > 100) {
    alert("יש להזין ציון בין 0 ל-100");
    return;
  }

  try {
   const r = await fetch(
  SUPABASE_URL + "/functions/v1/teacher-submissions",
  {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      action: "save",
     teacher_password: document.getElementById("teacher_password").value.trim(),
      submission_id: row.id,
      score: Number(score),
      feedback: feedback
    })
  }
);

    if (!r.ok) {
      throw new Error(await r.text());
    }

    alert("הבדיקה נשמרה");
  } catch (e) {
    console.error(e);
    alert("שגיאה בשמירת הבדיקה");
  }
};
  document.getElementById("closeSubmission").onclick = () => {
    viewer.remove();
  };

  viewer.scrollIntoView({ behavior: "smooth" });
}
function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

</script>

</body>
</html>
