<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בדיקת תרגול קצר</title>
<style>
body {font-family:Arial,sans-serif;max-width:820px;margin:30px auto;padding:16px;background:#fafafa;text-align:right}
.card {background:white;border:1px solid #ddd;border-radius:14px;padding:18px;margin:14px 0}
input,button {font-size:16px;padding:10px;width:100%;box-sizing:border-box;margin:6px 0}
button{cursor:pointer} nav{margin-bottom:14px} nav a{margin-left:14px}
.muted{color:#666}.success{color:#087a20;font-weight:bold}.error{color:#a00;font-weight:bold}
</style>
</head>
<body>
<h1>בדיקת תרגול קצר</h1>
<nav>
  <a href="index.html">הגשת עבודה</a>
  <a href="results.html">התוצאות שלי</a>
  <a href="teacher.html">מרצה</a>
</nav>
<div class="card">
<h2>הגשת עבודה</h2>
<p class="muted">אין צורך בשם. יש להשתמש בקוד אישי ובקוד PIN.</p>
<input id="student_code" placeholder="קוד סטודנט, לדוגמה MATH-2741">
<input id="pin" type="password" placeholder="קוד PIN">
<input id="quiz_id" placeholder="מספר הבוחן, לדוגמה 1">
<input id="files" type="file" accept=".png,.jpg,.jpeg,image/png,image/jpeg" multiple>
<p class="muted">ניתן לבחור מספר תמונות יחד. מומלץ לבחור אותן לפי סדר העמודים.</p>
<button id="submit">שליחה</button>
<p id="status"></p>
</div>
<script>
const API_BASE = "https://math-mini-check.onrender.com";

document.getElementById("submit").onclick = async () => {
  const status = document.getElementById("status");
  const studentCode = document.getElementById("student_code").value.trim();
  const pin = document.getElementById("pin").value.trim();
  const quizId = document.getElementById("quiz_id").value.trim();
  const files = Array.from(document.getElementById("files").files);

  status.className = "";
  status.textContent = "";

  if (!studentCode || !pin || !quizId || files.length === 0) {
    status.className = "error";
    status.textContent = "יש למלא את כל השדות ולבחור לפחות תמונה אחת.";
    return;
  }

  for (const file of files) {
    const n=(file.name||"").toLowerCase();
    if (!(n.endsWith(".png") || n.endsWith(".jpg") || n.endsWith(".jpeg"))) {
      status.className="error";
      status.textContent="ניתן להעלות רק קבצי PNG או JPG.";
      return;
    }
  }

  try {
    status.textContent = "מעלה " + files.length + " תמונות...";
    const form = new FormData();
    form.append("student_code", studentCode);
    form.append("pin", pin);
    form.append("quiz_id", quizId);
    for (const file of files) form.append("files", file);

    const response = await fetch(API_BASE + "/submit", {method:"POST", body:form});
    let data={}; try{data=await response.json();}catch(_){ }

    if (!response.ok) {
      status.className="error";
      status.textContent=data.error || "שגיאה בשליחת העבודה.";
      return;
    }

    status.className="success";
    status.textContent="העבודה נשלחה בהצלחה. הועלו " + files.length + " תמונות.";
    document.getElementById("files").value="";
    document.getElementById("quiz_id").value="";
  } catch(error) {
    console.error(error);
    status.className="error";
    status.textContent="שגיאת תקשורת.";
  }
};
</script>
</body>
</html>
