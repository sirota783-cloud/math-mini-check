<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>בדיקת תרגול קצר</title>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 820px;
  margin: 30px auto;
  padding: 16px;
  background: #fafafa;
  text-align: right;
}

.card {
  background: white;
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 18px;
  margin: 14px 0;
}

input, select, button {
  font-size: 16px;
  padding: 10px;
  width: 100%;
  box-sizing: border-box;
  margin: 6px 0;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.65;
}

nav {
  margin-bottom: 14px;
}

nav a {
  margin-left: 14px;
}

.muted {
  color: #666;
}

.success {
  color: #087a20;
  font-weight: bold;
}

.error {
  color: #a00;
  font-weight: bold;
}

.quiz-box {
  background: #f3f6fa;
  border: 1px solid #ccd5df;
  border-radius: 10px;
  padding: 12px;
  margin: 12px 0;
  font-size: 18px;
  font-weight: bold;
}

#ai_box {
  display: none;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid #ddd;
}

#grade_result {
  margin-top: 10px;
  line-height: 1.6;
}

#delete_submission {
  background: #fff3f3;
  border: 1px solid #c55;
}
</style>
</head>

<body>

<h1>בדיקת תרגול קצר</h1>

<nav>
  <a id="submit_link" href="#">הגשת עבודה</a>
  <a href="results.html">התוצאות שלי</a>
  <a href="teacher.html">מרצה</a>
</nav>

<div class="card">

<h2>הגשת עבודה</h2>

<p class="muted">
אין צורך בשם. יש להשתמש בקוד אישי ובקוד PIN.
</p>

<input
  id="student_code"
  placeholder="קוד סטודנט, לדוגמה MATH-2741"
>

<input
  id="pin"
  type="password"
  placeholder="קוד PIN"
>

<label for="course_select"><strong>מקצוע:</strong></label>
<select id="course_select">
  <option value="MATH">מתמטיקה — קורס הכנה</option>
  <option value="DISCRETE">מתמטיקה בדידה</option>
</select>

<label for="quiz_select"><strong>מספר תרגול:</strong></label>
<select id="quiz_select"></select>

<div class="quiz-box" id="quiz_display">
טוען פרטי בוחן...
</div>

<input
  id="files"
  type="file"
  accept=".png,.jpg,.jpeg,image/png,image/jpeg"
  multiple
>

<p class="muted">
ניתן לבחור מספר תמונות יחד.
מומלץ לבחור אותן לפי סדר העמודים.
</p>

<button id="submit">
שליחה
</button>

<p id="status"></p>

<div id="ai_box">

<p class="success">
העבודה התקבלה. לאחר שווידאת שכל העמודים נשלחו, ניתן להתחיל את הבדיקה.
</p>

<button id="ai_grade">
בדיקה עם AI וקבלת ציון
</button>

<button id="delete_submission">
מחיקת ההגשה
</button>

<div id="grade_result"></div>

</div>

</div>


<script>

const API_BASE =
  "https://math-mini-check.onrender.com";


const params =
  new URLSearchParams(
    window.location.search
  );


let COURSE_ID =
  params.get("course") || "MATH";

const GROUP_ID =
  params.get("group") || "general";

let QUIZ_ID =
  params.get("quiz") || "1";


const COURSE_LABELS = {
  MATH: "מתמטיקה — קורס הכנה",
  DISCRETE: "מתמטיקה בדידה",
  general: "כללי"
};


const courseSelect =
  document.getElementById("course_select");

if (![...courseSelect.options].some(
  option => option.value === COURSE_ID
)) {
  const option = document.createElement("option");
  option.value = COURSE_ID;
  option.textContent = COURSE_ID;
  courseSelect.appendChild(option);
}

courseSelect.value = COURSE_ID;


const quizSelect =
  document.getElementById("quiz_select");

for (let number = 1; number <= 15; number += 1) {
  const option = document.createElement("option");
  option.value = String(number);
  option.textContent = "תרגול " + number;
  quizSelect.appendChild(option);
}

if (![...quizSelect.options].some(
  option => option.value === QUIZ_ID
)) {
  const option = document.createElement("option");
  option.value = QUIZ_ID;
  option.textContent = "תרגול " + QUIZ_ID;
  quizSelect.appendChild(option);
}

quizSelect.value = QUIZ_ID;


function openSelectedPractice() {
  const nextCourse = courseSelect.value;
  const nextQuiz = quizSelect.value;

  window.location.href =
    "index.html?course=" + encodeURIComponent(nextCourse) +
    "&group=" + encodeURIComponent(GROUP_ID) +
    "&quiz=" + encodeURIComponent(nextQuiz);
}

courseSelect.addEventListener("change", openSelectedPractice);
quizSelect.addEventListener("change", openSelectedPractice);


document.getElementById("submit_link").href =
  "index.html?course=" +
  encodeURIComponent(COURSE_ID) +
  "&group=" +
  encodeURIComponent(GROUP_ID) +
  "&quiz=" +
  encodeURIComponent(QUIZ_ID);


const quizDisplay =
  document.getElementById(
    "quiz_display"
  );


quizDisplay.textContent =
  "מקצוע: " + (COURSE_LABELS[COURSE_ID] || COURSE_ID) +
  " | קבוצה: " + GROUP_ID +
  " | תרגול מספר " + QUIZ_ID;


let lastSubmissionId = null;
let lastStudentCode = "";
let lastPin = "";


const STORAGE_KEY =
  "mini_check_current_submission_v2::" +
  COURSE_ID + "::" +
  GROUP_ID + "::" +
  QUIZ_ID;


function saveSubmissionState() {
  sessionStorage.setItem(
    STORAGE_KEY,
    JSON.stringify({
      submission_id: lastSubmissionId,
      student_code: lastStudentCode,
      pin: lastPin
    })
  );
}


function clearSavedSubmissionState() {
  sessionStorage.removeItem(STORAGE_KEY);
}


function restoreSubmissionState() {

  let saved = null;

  try {
    saved = JSON.parse(
      sessionStorage.getItem(STORAGE_KEY) || "null"
    );
  }
  catch (_) {
    clearSavedSubmissionState();
    return;
  }

  if (
    !saved ||
    !saved.submission_id ||
    !saved.student_code ||
    !saved.pin
  ) {
    return;
  }

  lastSubmissionId = saved.submission_id;
  lastStudentCode = saved.student_code;
  lastPin = saved.pin;

  document.getElementById("student_code").value =
    lastStudentCode;

  document.getElementById("pin").value =
    lastPin;

  const status =
    document.getElementById("status");

  status.className = "success";
  status.textContent =
    "נמצאה הגשה קיימת. ניתן להמשיך לבדיקה או למחוק את ההגשה.";

  document.getElementById("ai_box").style.display =
    "block";

  const aiButton =
    document.getElementById("ai_grade");

  aiButton.disabled = false;
  aiButton.textContent =
    "בדיקה עם AI וקבלת ציון";

  const deleteButton =
    document.getElementById("delete_submission");

  deleteButton.disabled = false;
  deleteButton.style.display = "block";
}



async function findExistingSubmission() {

  const studentCode =
    document.getElementById(
      "student_code"
    ).value.trim();

  const pin =
    document.getElementById(
      "pin"
    ).value.trim();

  if (!studentCode || !pin) {
    return;
  }

  const status =
    document.getElementById("status");

  const gradeResult =
    document.getElementById(
      "grade_result"
    );

  const aiBox =
    document.getElementById(
      "ai_box"
    );

  const aiButton =
    document.getElementById(
      "ai_grade"
    );

  const deleteButton =
    document.getElementById(
      "delete_submission"
    );

  const submitButton =
    document.getElementById(
      "submit"
    );

  try {

    status.className = "";
    status.textContent =
      "בודק אם קיימת הגשה...";

    const response =
      await fetch(
        API_BASE + "/student/submission",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            student_code:
              studentCode,

            pin:
              pin,

            course_id:
              COURSE_ID,

            group_id:
              GROUP_ID,

            quiz_id:
              QUIZ_ID
          })
        }
      );

    let data = {};

    try {
      data = await response.json();
    }
    catch (_) {}

    if (!response.ok) {

      status.className =
        "error";

      status.textContent =
        data.error ||
        "שגיאה בבדיקת ההגשה.";

      return;
    }

    if (!data.found) {

      clearSavedSubmissionState();

      lastSubmissionId = null;
      lastStudentCode = "";
      lastPin = "";

      aiBox.style.display =
        "none";

      gradeResult.textContent = "";

      submitButton.disabled =
        false;

      status.className = "";
      status.textContent = "";

      return;
    }

    lastSubmissionId =
      data.submission_id;

    lastStudentCode =
      studentCode;

    lastPin =
      pin;

    saveSubmissionState();

    submitButton.disabled =
      true;

    aiBox.style.display =
      "block";

    gradeResult.className = "";

    const currentStatus =
      data.status || "submitted";

    if (currentStatus === "submitted") {

      status.className =
        "success";

      status.textContent =
        "נמצאה הגשה קיימת. ניתן להתחיל בדיקה או למחוק את ההגשה.";

      aiButton.disabled =
        false;

      aiButton.textContent =
        "בדיקה עם AI וקבלת ציון";

      deleteButton.disabled =
        false;

      deleteButton.style.display =
        "block";

      gradeResult.textContent = "";

      return;
    }

    deleteButton.disabled =
      true;

    deleteButton.style.display =
      "none";

    if (currentStatus === "graded") {

      status.className =
        "success";

      status.textContent =
        "העבודה כבר נבדקה.";

      aiButton.disabled =
        true;

      aiButton.textContent =
        "הבדיקה הסתיימה";

      gradeResult.className =
        "success";

      gradeResult.innerHTML =
        "ציון: <strong>" +
        escapeHtml(
          data.score
        ) +
        "</strong>" +
        (
          data.feedback
          ? "<br>הערה: " +
            escapeHtml(
              data.feedback
            )
          : ""
        );

      return;
    }

    if (currentStatus === "grading") {

      status.className =
        "success";

      status.textContent =
        "העבודה נמצאה והבדיקה כבר התחילה.";

      aiButton.disabled =
        true;

      aiButton.textContent =
        "הבדיקה מתבצעת";

      gradeResult.textContent =
        "נא להמתין לסיום הבדיקה.";

      return;
    }

    status.className =
      "success";

    status.textContent =
      "העבודה נמצאה.";

    gradeResult.className =
      "error";

    gradeResult.textContent =
      data.feedback ||
      "העבודה דורשת בדיקת מרצה.";

    aiButton.disabled = true;
    aiButton.textContent =
      "נדרשת בדיקת מרצה";

  }

  catch(error) {

    console.error(error);

    status.className =
      "error";

    status.textContent =
      "שגיאת תקשורת.";
  }
}


function scheduleExistingSubmissionCheck() {

  window.setTimeout(
    () => {
      findExistingSubmission();
    },
    300
  );
}


function resetSubmissionState() {

  clearSavedSubmissionState();

  lastSubmissionId = null;
  lastStudentCode = "";
  lastPin = "";

  document.getElementById(
    "ai_box"
  ).style.display = "none";

  document.getElementById(
    "grade_result"
  ).textContent = "";

  document.getElementById(
    "ai_grade"
  ).disabled = false;

  document.getElementById(
    "ai_grade"
  ).textContent =
    "בדיקה עם AI וקבלת ציון";

  const deleteButton =
    document.getElementById(
      "delete_submission"
    );

  deleteButton.disabled = false;
  deleteButton.style.display = "block";

  document.getElementById(
    "submit"
  ).disabled = false;
}



document.getElementById("submit").onclick =
async () => {

  const status =
    document.getElementById("status");

  const aiBox =
    document.getElementById("ai_box");

  const gradeResult =
    document.getElementById("grade_result");

  const submitButton =
    document.getElementById("submit");


  const studentCode =
    document.getElementById(
      "student_code"
    ).value.trim();


  const pin =
    document.getElementById(
      "pin"
    ).value.trim();


  const files =
    Array.from(
      document.getElementById(
        "files"
      ).files
    );


  status.className = "";
  status.textContent = "";

  gradeResult.className = "";
  gradeResult.textContent = "";

  aiBox.style.display = "none";

  lastSubmissionId = null;


  if (
    !studentCode ||
    !pin ||
    files.length === 0
  ) {

    status.className = "error";

    status.textContent =
      "יש למלא קוד סטודנט, קוד PIN ולבחור לפחות תמונה אחת.";

    return;
  }


  for (const file of files) {

    const n =
      (file.name || "").toLowerCase();


    if (
      !(
        n.endsWith(".png") ||
        n.endsWith(".jpg") ||
        n.endsWith(".jpeg")
      )
    ) {

      status.className = "error";

      status.textContent =
        "ניתן להעלות רק קבצי PNG או JPG.";

      return;
    }
  }


  const selectedCourseLabel =
    courseSelect.options[
      courseSelect.selectedIndex
    ]?.textContent?.trim() ||
    COURSE_ID;

  const selectedQuizLabel =
    quizSelect.options[
      quizSelect.selectedIndex
    ]?.textContent?.trim() ||
    ("תרגול " + QUIZ_ID);

  const submissionConfirmed =
    window.confirm(
      "נא לבדוק לפני ההגשה:\n\n" +
      "מקצוע: " + selectedCourseLabel + "\n" +
      "מספר תרגול: " + selectedQuizLabel + "\n" +
      "מספר תמונות: " + files.length + "\n\n" +
      "האם הפרטים נכונים וברצונך להגיש את העבודה?"
    );

  if (!submissionConfirmed) {

    status.className = "";
    status.textContent =
      "ההגשה בוטלה. ניתן לתקן את המקצוע או את מספר התרגול ולנסות שוב.";

    return;
  }


  try {

    submitButton.disabled = true;

    status.textContent =
      "
