<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>בדיקת תרגול קצר</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 820px;
      margin: 30px auto;
      padding: 16px;
      background: #fafafa;
      text-align: right;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 18px;
      margin: 14px 0;
    }

    input, button {
      font-size: 16px;
      padding: 10px;
      width: 100%;
      box-sizing: border-box;
      margin: 6px 0;
    }

    button {
      cursor: pointer;
    }

    nav a {
      margin-left: 14px;
    }

    .muted {
      color: #666;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>בדיקת תרגול קצר</h1>

  <nav>
    <a href="index.html">הגשת עבודה</a>
    <a href="results.html">התוצאות שלי</a>
    <a href="teacher.html">מרצה</a>
  </nav>

  <div class="card">

    <h2>הגשת עבודה</h2>

    <p class="muted">
      אין צורך בשם. יש להשתמש בקוד אישי ובקוד PIN.
    </p>

    <input
      id="student_code"
      placeholder="קוד סטודנט, לדוגמה MATH-2741"
    >

    <input
      id="pin"
      type="password"
      placeholder="קוד PIN"
    >

    <input
      id="quiz_id"
      placeholder="מספר הבוחן, לדוגמה 1"
    >

    <input
      id="file"
      type="file"
      accept=".png,.jpg,.jpeg,.pdf"
    >

    <button id="submit">
      שליחה
    </button>

    <p id="status"></p>

  </div>


<script>

const SUPABASE_URL =
  "https://bthkzkdsijnhuvnewzuj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_gsoH21Rei_f5rQyrjXyXPQ_8oI8LKR0";


document.getElementById("submit").addEventListener("click", async () => {

  const studentCode =
    document.getElementById("student_code").value.trim();

  const pin =
    document.getElementById("pin").value.trim();

  const quizId =
    document.getElementById("quiz_id").value.trim();

  const file =
    document.getElementById("file").files[0];

  const status =
    document.getElementById("status");


  if (!studentCode || !pin || !quizId) {
    status.textContent = "יש למלא קוד סטודנט, PIN ומספר בוחן.";
    return;
  }

  if (!file) {
    status.textContent = "יש לבחור קובץ.";
    return;
  }


  status.textContent = "שולח...";


  try {

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/mini_check_submissions",
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },

        body: JSON.stringify({

          student_code: studentCode,

          pin_hash: pin,

          quiz_id: quizId,

          file_path: file.name,

          status: "submitted"

        })
      }
    );


    if (!response.ok) {

      const errorText = await response.text();

      console.error(errorText);

      status.textContent =
        "שגיאה בשליחה.";

      return;
    }


    status.textContent =
      "העבודה נשלחה בהצלחה.";

    document.getElementById("quiz_id").value = "";
    document.getElementById("file").value = "";

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "שגיאת תקשורת.";

  }

});

</script>

</body>
</html>
