<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>בדיקת תרגול קצר</title>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 820px;
  margin: 30px auto;
  padding: 16px;
  background: #fafafa;
  text-align: right;
}

.card {
  background: white;
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 18px;
  margin: 14px 0;
}

input, button {
  font-size: 16px;
  padding: 10px;
  width: 100%;
  box-sizing: border-box;
  margin: 6px 0;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.65;
}

nav {
  margin-bottom: 14px;
}

nav a {
  margin-left: 14px;
}

.muted {
  color: #666;
}

.success {
  color: #087a20;
  font-weight: bold;
}

.error {
  color: #a00;
  font-weight: bold;
}

.quiz-box {
  background: #f3f6fa;
  border: 1px solid #ccd5df;
  border-radius: 10px;
  padding: 12px;
  margin: 12px 0;
  font-size: 18px;
  font-weight: bold;
}

#ai_box {
  display: none;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid #ddd;
}

#grade_result {
  margin-top: 10px;
  line-height: 1.6;
}
</style>
</head>

<body>

<h1>בדיקת תרגול קצר</h1>

<nav>
  <a href="index.html">הגשת עבודה</a>
  <a href="results.html">התוצאות שלי</a>
  <a href="teacher.html">מרצה</a>
</nav>

<div class="card">

<h2>הגשת עבודה</h2>

<p class="muted">
אין צורך בשם. יש להשתמש בקוד אישי ובקוד PIN.
</p>

<input
  id="student_code"
  placeholder="קוד סטודנט, לדוגמה MATH-2741"
>

<input
  id="pin"
  type="password"
  placeholder="קוד PIN"
>

<div class="quiz-box" id="quiz_display">
טוען פרטי בוחן...
</div>

<input
  id="files"
  type="file"
  accept=".png,.jpg,.jpeg,image/png,image/jpeg"
  multiple
>

<p class="muted">
ניתן לבחור מספר תמונות יחד.
מומלץ לבחור אותן לפי סדר העמודים.
</p>

<button id="submit">
שליחה
</button>

<p id="status"></p>

<div id="ai_box">

<p class="success">
העבודה התקבלה. לאחר שווידאת שכל העמודים נשלחו, ניתן להתחיל את הבדיקה.
</p>

<button id="ai_grade">
בדיקה עם AI וקבלת ציון
</button>

<div id="grade_result"></div>

</div>

</div>


<script>

const API_BASE =
  "https://math-mini-check.onrender.com";


const params =
  new URLSearchParams(
    window.location.search
  );


const COURSE_ID =
  params.get("course") || "general";

const GROUP_ID =
  params.get("group") || "general";

const QUIZ_ID =
  params.get("quiz") || "1";


const quizDisplay =
  document.getElementById(
    "quiz_display"
  );


quizDisplay.textContent =
  "מקצוע: " + COURSE_ID +
  " | קבוצה: " + GROUP_ID +
  " | בוחן מספר " + QUIZ_ID;


let lastSubmissionId = null;
let lastStudentCode = "";
let lastPin = "";


document.getElementById("submit").onclick =
async () => {

  const status =
    document.getElementById("status");

  const aiBox =
    document.getElementById("ai_box");

  const gradeResult =
    document.getElementById("grade_result");

  const submitButton =
    document.getElementById("submit");


  const studentCode =
    document.getElementById(
      "student_code"
    ).value.trim();


  const pin =
    document.getElementById(
      "pin"
    ).value.trim();


  const files =
    Array.from(
      document.getElementById(
        "files"
      ).files
    );


  status.className = "";
  status.textContent = "";

  gradeResult.className = "";
  gradeResult.textContent = "";

  aiBox.style.display = "none";

  lastSubmissionId = null;


  if (
    !studentCode ||
    !pin ||
    files.length === 0
  ) {

    status.className = "error";

    status.textContent =
      "יש למלא קוד סטודנט, קוד PIN ולבחור לפחות תמונה אחת.";

    return;
  }


  for (const file of files) {

    const n =
      (file.name || "").toLowerCase();


    if (
      !(
        n.endsWith(".png") ||
        n.endsWith(".jpg") ||
        n.endsWith(".jpeg")
      )
    ) {

      status.className = "error";

      status.textContent =
        "ניתן להעלות רק קבצי PNG או JPG.";

      return;
    }
  }


  try {

    submitButton.disabled = true;

    status.textContent =
      "מעלה את העבודה...";


    const form =
      new FormData();


    form.append(
      "student_code",
      studentCode
    );

    form.append(
      "pin",
      pin
    );

    form.append(
      "course_id",
      COURSE_ID
    );

    form.append(
      "group_id",
      GROUP_ID
    );

    form.append(
      "quiz_id",
      QUIZ_ID
    );


    for (const file of files) {

      form.append(
        "files",
        file
      );
    }


    const response =
      await fetch(
        API_BASE + "/submit",
        {
          method: "POST",
          body: form
        }
      );


    let data = {};


    try {

      data =
        await response.json();

    }

    catch (_) {}


    if (!response.ok) {

      status.className =
        "error";

      status.textContent =
        data.error ||
        "שגיאה בשליחת העבודה.";

      return;
    }


    lastSubmissionId =
      data.submission_id;


    lastStudentCode =
      studentCode;


    lastPin =
      pin;


    status.className =
      "success";


    status.textContent =
      "העבודה נשלחה בהצלחה. הועלו " +
      files.length +
      " תמונות.";


    document.getElementById(
      "files"
    ).value = "";


    aiBox.style.display =
      "block";

  }


  catch(error) {

    console.error(error);

    status.className =
      "error";

    status.textContent =
      "שגיאת תקשורת.";

  }


  finally {

    submitButton.disabled = false;

  }

};



document.getElementById("ai_grade").onclick =
async () => {

  const button =
    document.getElementById("ai_grade");


  const gradeResult =
    document.getElementById(
      "grade_result"
    );


  if (
    !lastSubmissionId ||
    !lastStudentCode ||
    !lastPin
  ) {

    gradeResult.className =
      "error";

    gradeResult.textContent =
      "לא נמצאה הגשה לבדיקה.";

    return;
  }


  try {

    button.disabled = true;


    gradeResult.className = "";


    gradeResult.textContent =
      "הבדיקה מתבצעת. נא להמתין...";


    const response =
      await fetch(
        API_BASE + "/student/grade",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            submission_id:
              lastSubmissionId,

            student_code:
              lastStudentCode,

            pin:
              lastPin

          })
        }
      );


    let data = {};


    try {

      data =
        await response.json();

    }

    catch (_) {}


    if (!response.ok) {

      gradeResult.className =
        "error";


      gradeResult.textContent =
        data.error ||
        "שגיאה בבדיקת AI.";


      button.disabled = false;

      return;
    }


    if (
      data.status === "graded" &&
      data.score !== null &&
      data.score !== undefined
    ) {

      gradeResult.className =
        "success";


      gradeResult.innerHTML =
        "הבדיקה הסתיימה.<br>" +

        "ציון: <strong>" +
        data.score +
        "</strong>" +

        (
          data.feedback
          ? "<br>הערה: " +
            escapeHtml(
              data.feedback
            )
          : ""
        ) +

        '<br><br>' +
        '<a href="results.html">' +
        'מעבר לתוצאות שלי' +
        '</a>';


      button.textContent =
        "הבדיקה הסתיימה";

    }


    else {

      gradeResult.className =
        "error";


      gradeResult.textContent =
        data.feedback ||
        "העבודה דורשת בדיקת מרצה.";


      button.disabled =
        false;

    }

  }


  catch(error) {

    console.error(error);


    gradeResult.className =
      "error";


    gradeResult.textContent =
      "שגיאת תקשורת.";


    button.disabled =
      false;

  }

};



function escapeHtml(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

</script>

</body>
</html>
