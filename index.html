<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בדיקת תרגול קצר</title>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 820px;
  margin: 30px auto;
  padding: 16px;
  background: #fafafa;
  text-align: right;
}

.card {
  background: white;
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 18px;
  margin: 14px 0;
}

input, button {
  font-size: 16px;
  padding: 10px;
  width: 100%;
  box-sizing: border-box;
  margin: 6px 0;
}

button {
  cursor: pointer;
}

nav {
  margin-bottom: 14px;
}

nav a {
  margin-left: 14px;
}

.muted {
  color: #666;
}

.success {
  color: #087a20;
  font-weight: bold;
}

.error {
  color: #a00;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>בדיקת תרגול קצר</h1>

<nav>
  <a href="index.html">הגשת עבודה</a>
  <a href="results.html">התוצאות שלי</a>
  <a href="teacher.html">מרצה</a>
</nav>

<div class="card">

<h2>הגשת עבודה</h2>

<p class="muted">
אין צורך בשם. יש להשתמש בקוד אישי ובקוד PIN.
</p>

<input
  id="student_code"
  placeholder="קוד סטודנט, לדוגמה MATH-2741"
>

<input
  id="pin"
  type="password"
  placeholder="קוד PIN"
>

<input
  id="quiz_id"
  placeholder="מספר הבוחן, לדוגמה 1"
>

<input
  id="file"
  type="file"
  accept=".png,.jpg,.jpeg"
  multiple
>

<p class="muted">
ניתן לבחור מספר תמונות יחד.
</p>

<button id="submit">שליחה</button>

<p id="status"></p>

</div>

<script>

const SUPABASE_URL =
  "https://bthkzkdsijnhuvnewzuj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_gsoH21Rei_f5rQyrjXyXPQ_8oI8LKR0";

const BUCKET = "mini-check-files";


function safeFileName(name) {
  return name.replace(/[^a-zA-Z0-9._-]/g, "_");
}


document.getElementById("submit").onclick = async () => {

  const status = document.getElementById("status");

  const studentCode =
    document.getElementById("student_code").value.trim();

  const pin =
    document.getElementById("pin").value.trim();

  const quizId =
    document.getElementById("quiz_id").value.trim();

  const files =
    Array.from(document.getElementById("file").files);


  status.className = "";
  status.textContent = "";


  if (!studentCode || !pin || !quizId || files.length === 0) {
    status.className = "error";
    status.textContent =
      "יש למלא את כל השדות ולבחור לפחות תמונה אחת.";
    return;
  }


  try {

    const uploadedPaths = [];


    /* 1. Upload all images to Supabase Storage */

    for (let i = 0; i < files.length; i++) {

      const file = files[i];

      const fileName =
        safeFileName(file.name);

      const filePath =
        studentCode + "/" +
        quizId + "/" +
        Date.now() + "-" +
        (i + 1) + "-" +
        fileName;


      const encodedPath =
        filePath
          .split("/")
          .map(encodeURIComponent)
          .join("/");


      status.textContent =
        "מעלה תמונה " +
        (i + 1) +
        " מתוך " +
        files.length +
        "...";


      const uploadResponse = await fetch(
        SUPABASE_URL +
        "/storage/v1/object/" +
        BUCKET +
        "/" +
        encodedPath,
        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Content-Type":
              file.type || "application/octet-stream",
            "x-upsert": "false"
          },

          body: file
        }
      );


      if (!uploadResponse.ok) {

        const errorText =
          await uploadResponse.text();

        console.error(
          "Storage error:",
          errorText
        );

        status.className = "error";

        status.textContent =
          "שגיאה בהעלאת תמונה " +
          (i + 1) +
          ".";

        return;
      }


      uploadedPaths.push(filePath);
    }


    status.textContent =
      "שומר את ההגשה...";


    /* 2. Save one submission containing all image paths */

    const saveResponse = await fetch(
      SUPABASE_URL +
      "/rest/v1/mini_check_submissions",
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY,
          "Content-Type":
            "application/json",
          "Prefer": "return=minimal"
        },

        body: JSON.stringify({
          student_code: studentCode,
          pin_hash: pin,
          quiz_id: quizId,
          file_path:
            JSON.stringify(uploadedPaths),
          status: "submitted"
        })
      }
    );


    if (!saveResponse.ok) {

      const errorText =
        await saveResponse.text();

      console.error(
        "Database error:",
        errorText
      );

      status.className = "error";

      if (saveResponse.status === 409) {
        status.textContent =
          "העבודה הזאת כבר הוגשה. לא ניתן להגיש אותה שוב.";
      } else {
        status.textContent =
          "שגיאה בשמירת ההגשה.";
      }

      return;
    }


    status.className = "success";
    status.textContent =
      "העבודה נשלחה בהצלחה.";

    document.getElementById("file").value = "";
    document.getElementById("quiz_id").value = "";

  }

  catch (error) {

    console.error(error);

    status.className = "error";
    status.textContent =
      "שגיאת תקשורת.";

  }

};

</script>

</body>
</html>
